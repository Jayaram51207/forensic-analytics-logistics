<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forensic Investigation</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1c2430; --mute:#5d6b7c; --line:#dfe3e8; --hi:#b42318; --med:#b54708; --low:#175cd3; --ok:#067647; --cite:#fff7e6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --panel:#1b212a; --ink:#e6eaf0; --mute:#97a3b3; --line:#2c3541; --hi:#f97066; --med:#fdb022; --low:#84adff; --ok:#47cd89; --cite:#33290f; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  main { display:grid; grid-template-columns:minmax(300px, 380px) 1fr; gap:16px; padding:16px 20px; align-items:start; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; overflow-x:auto; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); margin:0 0 8px; }
  .case { padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer; }
  .case:hover, .case.sel { border-color:var(--low); }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .mute { color:var(--mute); font-size:12px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; border:1px solid currentColor; }
  .high { color:var(--hi); } .medium { color:var(--med); } .low, .informational { color:var(--low); } .ok { color:var(--ok); }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mute); font-weight:600; white-space:nowrap; }
  tr.cited td { background:var(--cite); }
  code, .mono { font:12px ui-monospace, Consolas, monospace; word-break:break-all; }
  .finding { border-left:3px solid var(--line); padding:4px 0 4px 10px; margin-bottom:10px; }
  .finding.high { border-color:var(--hi); } .finding.medium { border-color:var(--med); } .finding.low { border-color:var(--low); }
  .finding p { margin:3px 0; color:var(--ink); }
  .chg { margin:2px 0 0; padding:0; list-style:none; }
  .chg li { font:12px ui-monospace, Consolas, monospace; }
  .old { color:var(--hi); text-decoration:line-through; } .new { color:var(--ok); }
  select, input, textarea, button { font:inherit; padding:5px 7px; border:1px solid var(--line); border-radius:5px; background:var(--panel); color:var(--ink); }
  button { cursor:pointer; }
  .warn { color:var(--hi); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Forensic Investigation</h1>
  <span id="integrity" class="mute">checking evidence integrity…</span>
  <span id="business-rules" class="mute"></span>
  <span class="mute">Findings are potential anomalies for human review. Scores rank the queue; they are not probabilities.</span>
</header>
<main>
  <section>
    <div class="panel"><h2>Review queue</h2><div id="cases"></div></div>
  </section>
  <section id="detail"><div class="panel mute">Select a case.</div></section>
</main>
<script>
// All data from the evidence store is untrusted text: it is only ever placed
// in the page through textContent, never as HTML.
const $ = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? e.className = v : k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
};
const show = v => v === null || v === undefined ? '∅' : typeof v === 'object' ? JSON.stringify(v) : String(v);
const short = h => h ? h.slice(0, 12) + '…' : '—';
let overview = null;

async function loadOverview(keep) {
  overview = await (await fetch('/api/overview')).json();
  const i = overview.integrity, el = document.getElementById('integrity');
  el.textContent = i.ok ? `Evidence chain verified: ${i.count} events, head ${short(i.last_hash)}` : `INTEGRITY PROBLEMS (${i.problems.length}): ${i.problems.slice(0, 3).map(p => p.type).join(', ')}`;
  el.className = i.ok ? 'ok' : 'warn';
  const br = overview.business_rules || { unresolved: [] }, bel = document.getElementById('business-rules');
  bel.textContent = br.unresolved.length ? `Business rules not configured: ${br.unresolved.join(', ')}. Results for these are unresolved, and workflow compliance is not verified.` : 'Business rules configured.';
  bel.className = br.unresolved.length ? 'warn' : 'ok';
  const box = document.getElementById('cases');
  box.replaceChildren(...overview.cases.map(c => $('div', { class: 'case' + (c.case_id === keep ? ' sel' : ''), onclick: () => openCase(c.case_id) },
    $('div', { class: 'row' }, $('strong', {}, c.job_no ?? '(no job number)'), $('span', { class: 'tag ' + c.band }, `${c.priority} ${c.band}`)),
    $('div', { class: 'mute' }, `${c.case_id} · ${c.status.replaceAll('_', ' ')} · ${c.n_anomaly_findings} finding(s), ${c.n_data_quality_findings} note(s)`),
    $('div', {}, c.reasons[0] || 'data-quality notes only'))));
  if (!overview.cases.length) box.append($('div', { class: 'mute' }, 'No cases.'));
}

function changes(list) {
  return $('ul', { class: 'chg' }, list.slice(0, 12).map(c => $('li', {}, c.field + ': ', $('span', { class: 'old' }, show(c.old)), ' → ', $('span', { class: 'new' }, show(c.new)))), list.length > 12 ? $('li', { class: 'mute' }, `… ${list.length - 12} more`) : null);
}

async function openCase(id) {
  const d = await (await fetch('/api/cases/' + encodeURIComponent(id))).json();
  document.querySelectorAll('.case').forEach(e => e.classList.remove('sel'));
  const s = d.priority.components;
  const el = document.getElementById('detail');
  el.replaceChildren(
    $('div', { class: 'panel' },
      $('h2', {}, 'Case'),
      $('div', { class: 'row' }, $('strong', {}, `${d.case_id} — job ${d.job_no}`), $('span', { class: 'tag ' + d.priority.band }, `priority ${d.priority.value} (${d.priority.band})`)),
      $('div', { class: 'mute' }, `status: ${d.status.replaceAll('_', ' ')} · correlation ${d.correlation_id} · job numbers seen: ${d.job_nos_seen.join(', ')} · sources: ${d.provenance.applications.join(', ')}`),
      $('div', { class: 'mute' }, `score = families ${JSON.stringify(s.families)} → base ${s.base} + corroboration ${s.corroboration_bonus}, × evidence factor ${s.evidence_gap_factor}`)),
    $('div', { class: 'panel' }, $('h2', {}, 'Why this was raised'),
      d.findings.map(f => $('div', { class: 'finding ' + f.severity },
        $('div', {}, $('span', { class: 'tag ' + f.severity }, f.severity), ' ', $('strong', {}, f.title), ' ', $('span', { class: 'mute' }, `${f.rule_id} v${f.rule_version} · ${f.kind.replace('_', ' ')}`)),
        $('p', {}, f.explanation),
        f.assessment && f.assessment.supports.length ? $('p', { class: 'ok' }, 'Supports: ' + f.assessment.supports.join(' ')) : null,
        f.assessment && f.assessment.weakens.length ? $('p', { class: 'mute' }, 'Weakens: ' + f.assessment.weakens.join(' ')) : (f.assumptions.length ? $('p', { class: 'mute' }, 'Assumptions: ' + f.assumptions.join(' ')) : null),
        $('div', { class: 'mute mono' }, 'evidence: ' + f.evidence_event_ids.join(', '))))),
    d.limitations.length ? $('div', { class: 'panel' }, $('h2', {}, 'Uncertainty and limitations'), $('ul', {}, d.limitations.map(l => $('li', {}, l)))) : null,
    ...(d.provenance ? provenancePanels(d.provenance) : []),
    $('div', { class: 'panel' }, $('h2', {}, 'Document generations'),
      $('table', {}, $('tr', {}, ['#', 'time', 'outcome', 'input hash', 'outputs (path · sha256 · content fingerprint)'].map(h => $('th', {}, h))),
        d.generations.map((g, i) => $('tr', {},
          $('td', {}, g.number), $('td', {}, g.at), $('td', { class: g.outcome === 'generated' ? 'ok' : 'warn' }, g.outcome),
          $('td', { class: 'mono' }, short(g.input_sha256) + (i && g.input_sha256 === d.generations[i - 1].input_sha256 ? ' (same as previous)' : '')),
          $('td', { class: 'mono' }, g.artifacts.length ? g.artifacts.map(a => $('div', {}, `${a.path} · ${short(a.sha256)} · ${short(a.content_fingerprint)}`)) : (g.error || '—').slice(0, 200))))),
      $('div', { class: 'mute' }, 'A matching hash shows two files have the same content. It says nothing about whether that content is correct.')),
    $('div', { class: 'panel' }, $('h2', {}, 'Timeline (highlighted rows are cited by a finding)'),
      $('table', {}, $('tr', {}, ['seq', 'time (UTC)', 'actor', 'event', 'details'].map(h => $('th', {}, h))),
        d.timeline.map(t => $('tr', { class: t.cited_by_finding ? 'cited' : '' },
          $('td', {}, t.sequence), $('td', {}, t.event_time.replace('T', ' ').replace('.000Z', ''), $('div', { class: 'mute' }, t.time_basis), t.ingested_at ? $('div', { class: 'mute' }, 'ingested ' + t.ingested_at.replace('T', ' ').replace('.000Z', '')) : null, t.order_uncertain ? $('div', { class: 'warn' }, 'order vs neighbours uncertain') : null),
          $('td', {}, t.actor || '—', $('div', { class: 'mute' }, t.actor_verified ? 'verified' : t.actor_source.replaceAll('_', ' ') + ', unverified')),
          $('td', {}, t.summary, $('div', { class: 'mute mono' }, t.event_id), t.link ? $('div', { class: 'mute' }, 'link: ' + t.link) : null),
          $('td', {}, t.changes.length ? changes(t.changes) : null, t.artifacts.map(a => $('div', { class: 'mono' }, `${a.role}: ${short(a.sha256)}`)))))),
      d.gaps.length ? $('p', { class: 'warn' }, 'Evidence gaps: ' + d.gaps.map(g => g.detail).join(' | ')) : null,
      $('p', { class: 'mute' }, d.timeline_note || 'An event missing from this list was not captured; that is not proof it did not happen.')),
    $('div', { class: 'panel' }, $('h2', {}, 'Review outcome'),
      d.dispositions.map(x => $('div', {}, `${x.at} — ${x.disposition.replaceAll('_', ' ')} by ${x.reviewer || 'unnamed'}: ${x.note}`)),
      overview.review_enabled ? $('div', { style: 'display:grid; gap:6px; max-width:520px; margin-top:8px' },
        $('select', { id: 'disp' }, overview.dispositions.map(x => $('option', { value: x }, x.replaceAll('_', ' ')))),
        $('input', { id: 'reviewer', placeholder: 'reviewer name' }), $('input', { id: 'token', type: 'password', placeholder: 'review token' }),
        $('textarea', { id: 'note', rows: 3, placeholder: 'basis for this assessment' }),
        $('button', { onclick: () => saveDisposition(d.case_id) }, 'Record assessment'), $('span', { id: 'saved', class: 'mute' }))
        : $('div', { class: 'mute' }, 'Read-only: recording assessments needs the dashboard to be started with FORENSIC_REVIEW_TOKEN.')));
}

const CLASS_STYLE = { potential_fraud_indicator_requiring_investigation: 'high', confirmed_data_inconsistency: 'medium', suspected_operational_anomaly: 'low', insufficient_evidence: 'informational', unresolved_business_rule_conflict: 'informational' };

function provenancePanels(p) {
  const item = i => $('div', { class: 'mono' }, `${i.application}: ${show(i.original)}${i.normalized !== null && typeof i.normalized !== 'object' ? ' = ' + i.normalized + (i.unit ? ' ' + i.unit : '') : ''}`, $('div', { class: 'mute' }, `${i.event_time.replace('T', ' ').replace('.000Z', '')} (${i.time_basis}) · ${i.actor.display_name || 'no actor'}${i.actor.verified ? ', verified' : ', unverified'} · ${i.evidence_id} · event ${i.event_id}`));
  return [
    $('div', { class: 'panel' }, $('h2', {}, 'Contradictions between applications'),
      p.contradictions.length ? p.contradictions.map(c => $('div', { class: 'finding ' + (CLASS_STYLE[c.classification] || 'low') },
        $('div', {}, $('span', { class: 'tag ' + (CLASS_STYLE[c.classification] || 'low') }, c.classification.replaceAll('_', ' ')), ' ', $('strong', {}, c.field.replaceAll('_', ' ')), ' ', $('span', { class: 'mute' }, `${c.rule_id} v${c.rule_version} · ${c.contradiction_id}`)),
        $('p', {}, c.explanation),
        c.items.map(item),
        $('div', { class: 'mute' }, `sources: ${(c.independence || 'n/a').replaceAll('_', ' ')} · link: ${c.entity_match.method.replaceAll('_', ' ')}, confidence ${c.entity_match.confidence}${c.entity_match.ambiguous ? ' (AMBIGUOUS)' : ''}${c.ordering ? ` · order: ${c.ordering.relation}${c.ordering.uncertain ? ' (uncertain)' : ''}` : ''}${c.difference && c.difference.relative !== undefined ? ` · difference ${c.difference.absolute} (${(c.difference.relative * 100).toFixed(1)}%)` : ''}`),
        c.supported_by.length ? $('p', { class: 'ok' }, 'Supports: ' + c.supported_by.join(' ')) : null,
        c.weakened_by.length ? $('p', { class: 'mute' }, 'Weakens: ' + c.weakened_by.join(' ')) : null,
        c.missing_business_rule ? $('p', { class: 'warn' }, 'Missing business rule: ' + c.missing_business_rule) : null,
        $('p', { class: 'mute' }, 'Next step: ' + c.recommendation)))
        : $('div', { class: 'mute' }, 'None found between the records linked to this shipment.')),
    $('div', { class: 'panel' }, $('h2', {}, 'Where key values come from'),
      $('table', {}, $('tr', {}, ['field', 'value in job', 'records agreeing', 'separate sources', 'reading'].map(h => $('th', {}, h))),
        Object.values(p.corroboration).map(c => c.status === 'not_comparable'
          ? $('tr', {}, $('td', {}, c.field.replaceAll('_', ' ')), $('td', { colspan: '4', class: 'mute' }, 'not comparable: ' + c.reason))
          : $('tr', {}, $('td', {}, c.field.replaceAll('_', ' ')), $('td', { class: 'mono' }, show(c.value)), $('td', {}, c.agreeing_records), $('td', { class: c.needs_independent_source ? 'warn' : '' }, c.independent_roots), $('td', {}, c.statement, c.weak_agreement && c.weak_agreement.length ? $('div', { class: 'mute' }, `Also matched, on an assumption only: ${c.weak_agreement.map(w => w.application).join(', ')}.`) : null)))),
      $('p', { class: 'mute' }, 'Records with one source are copies of one statement. Counting them twice would overstate the evidence.')),
    $('div', { class: 'panel' }, $('h2', {}, 'Evidence trust: four separate questions'),
      $('table', {},
        $('tr', {}, $('th', {}, 'Integrity of captured records'), $('td', {}, p.trust.integrity, $('div', { class: 'mute' }, p.trust.integrity_scope))),
        $('tr', {}, $('th', {}, 'Authenticity of sources'), $('td', {}, p.trust.authenticity)),
        $('tr', {}, $('th', {}, 'Accuracy of values'), $('td', {}, p.trust.accuracy)),
        $('tr', {}, $('th', {}, 'Independence'), $('td', {}, p.trust.independence))),
      $('h2', { style: 'margin-top:10px' }, 'Related records from other applications'),
      p.external_records.length ? $('table', {}, $('tr', {}, ['application', 'record', 'event time', 'link', 'confidence', 'comparable fields'].map(h => $('th', {}, h))),
        p.external_records.map(r => $('tr', {}, $('td', {}, r.application), $('td', {}, r.action, $('div', { class: 'mute mono' }, r.event_id)), $('td', {}, r.event_time.replace('T', ' ').replace('.000Z', '')), $('td', { class: r.entity_match.ambiguous ? 'warn' : '' }, r.entity_match.method.replaceAll('_', ' ') + (r.entity_match.ambiguous ? ' (ambiguous)' : '')), $('td', {}, r.entity_match.confidence), $('td', {}, r.comparable_fields.join(', ') || 'none'))))
        : $('div', { class: 'mute' }, 'None linked.'),
      $('h2', { style: 'margin-top:10px' }, 'Missing independent evidence'),
      $('ul', {}, p.missing_independent_evidence.map(m => $('li', {}, m))))
  ];
}

async function saveDisposition(id) {
  const val = x => document.getElementById(x).value;
  const res = await fetch(`/api/cases/${encodeURIComponent(id)}/disposition`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Review-Token': val('token') }, body: JSON.stringify({ disposition: val('disp'), reviewer: val('reviewer'), note: val('note') }) });
  const body = await res.json();
  if (!res.ok) { document.getElementById('saved').textContent = 'Not saved: ' + body.error; return; }
  await loadOverview(id);
  openCase(id);
}

loadOverview();
</script>
</body>
</html>
